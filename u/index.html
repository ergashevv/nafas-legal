<script>
  // nafas.../u/?malika  or  /u/#malika — only letters, digits and _ ever reach the app link.
  var raw = (location.search.slice(1) || location.hash.slice(1)).split('&')[0];
  var name = decodeURIComponent(raw).replace(/^@/, '').toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 24);
  if (name) {
    document.getElementById('handle').textContent = '@' + name;
    var link = 'nafas://u/' + name;
    document.getElementById('open').href = link;
    location.replace(link);
  } else {
    document.getElementById('hint').textContent = 'Havola to‘liq emas.';
  }
</script>
